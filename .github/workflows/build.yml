name: Build, test, and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: harness/requirements.lock
      - run: pip install -r harness/requirements.lock
      - run: python -m unittest discover -s harness
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check web/app.js
      - run: node --check web/theme.js
      - run: npm ci --prefix browser
      - run: npm test --prefix browser
      - run: npm run build --prefix browser
      - run: git diff --exit-code public/browser.js
      - run: test -z "$(gofmt -l . | grep -v wailsjs)"
  binaries:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Package standalone node and relay
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: sh scripts/package.sh "$RELEASE_VERSION" '${{ matrix.platform }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: output/*
  desktop:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-15
            name: darwin-arm64
          - os: macos-15-intel
            name: darwin-amd64
          - os: windows-latest
            name: windows-amd64
          - os: ubuntu-24.04
            name: linux-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: desktop/go.sum
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build native windowed app
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = Linux ]; then wails build -tags webkit2_41; else wails build; fi
      - name: Sign and notarize macOS (when distribution credentials are configured)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            bash scripts/sign-macos-ci.sh "desktop/build/bin/Rad Chat.app"
          else
            echo "Distribution credentials absent: this CI artifact is unsigned."
          fi
      - name: Package desktop
        run: |
          mkdir -p output
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'desktop/build/bin/*' -DestinationPath 'output/radchat-desktop-${{ matrix.name }}.zip'"
          else
            tar -czf 'output/radchat-desktop-${{ matrix.name }}.tar.gz' -C desktop/build/bin .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: output/*
  docker:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/dmikey/p2p-chat
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [binaries, desktop, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: output
          merge-multiple: true
          pattern: "!*.dockerbuild"
      - run: cp scripts/quick-install.sh output/quick-install.sh && cd output && sha256sum *.tar.gz *.zip quick-install.sh > SHA256SUMS
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" output/* --title "Rad Chat $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --prerelease
