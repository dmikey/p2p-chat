services:
  relay:
    image: ghcr.io/dmikey/p2p-chat:${RADCHAT_VERSION:-latest}
    restart: unless-stopped
    environment:
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:?Set SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:?Set a verified SendGrid sender}
      RADCHAT_PUBLIC_P2P: /dns4/${RADCHAT_DOMAIN:?Set your relay domain}/tcp/4001
    ports:
      - "4001:4001"
    volumes:
      - relay-state:/state
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/radchat", "healthcheck", "http://127.0.0.1:8788/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RADCHAT_DOMAIN: ${RADCHAT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      relay:
        condition: service_healthy
volumes:
  relay-state:
  caddy-data:
  caddy-config:
