services:
  relay:
    image: ghcr.io/dmikey/p2p-chat:${RADCHAT_VERSION:-latest}
    restart: unless-stopped
    environment:
      RADCHAT_EMAIL_PROVIDER: ${RADCHAT_EMAIL_PROVIDER:-sendgrid}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      RADCHAT_EMAIL_ADAPTER_URL: ${RADCHAT_EMAIL_ADAPTER_URL:-}
      RADCHAT_EMAIL_ADAPTER_TOKEN: ${RADCHAT_EMAIL_ADAPTER_TOKEN:-}
      RADCHAT_SOLANA_CLUSTER: ${RADCHAT_SOLANA_CLUSTER:-testnet}
      RADCHAT_WS_P2P: /ip4/0.0.0.0/tcp/4002/ws
      RADCHAT_PUBLIC_P2P: /dns4/${RADCHAT_DOMAIN:?Set your relay domain}/tcp/443/wss
    ports:
      - "4001:4001"
    volumes:
      - relay-state:/state
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/radchat", "healthcheck", "http://127.0.0.1:8788/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RADCHAT_DOMAIN: ${RADCHAT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      relay:
        condition: service_healthy
volumes:
  relay-state:
  caddy-data:
  caddy-config:
